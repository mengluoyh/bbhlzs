name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Initialize and build
        run: |
          bubblewrap init --manifest=https://mengluoyh.github.io/baby-care/manifest.json
          bubblewrap build
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app-release-signed.apk